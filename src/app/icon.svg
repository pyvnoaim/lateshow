<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 40 232 232">
  <!-- Lateshow: a frosted glass screen, a cool light setting inside it (Frost, icy). Source of truth for the logo. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/><stop offset="0.55" stop-color="#e6ebf2"/>
      <stop offset="0.86" stop-color="#ccd9ee"/><stop offset="1" stop-color="#8aa6d6"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4d4ef"/><stop offset="0.5" stop-color="#3d64b0"/><stop offset="1" stop-color="#c4d4ef"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.28" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#9fbbe8"/><stop offset="1" stop-color="#2f56a6"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="tile"><path id="shape" d="M98,46 H202 Q254,46 254,98 V202 Q254,254 202,254 H98 Q46,254 46,202 V98 Q46,46 98,46 Z"/></clipPath>
  </defs>
  <use href="#shape" fill="url(#slab)" transform="translate(0 12)"/>
  <use href="#shape" fill="url(#face)"/>
  <g clip-path="url(#tile)">
    <circle cx="150" cy="222" r="92" fill="url(#sun)" filter="url(#soft)"/>
    <rect x="0" y="0" width="300" height="320" fill="#fff" opacity="0.12"/>
    <rect x="0" y="0" width="300" height="320" fill="url(#sheen)"/>
    <use href="#shape" fill="none" stroke="url(#rim)" stroke-width="7"/>
  </g>
</svg>
