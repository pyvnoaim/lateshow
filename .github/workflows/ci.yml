name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (a moved tag could otherwise run code with our secrets). Dependabot bumps them.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Tells Portainer to pull and rebuild the stack, only after the checks passed. The webhook URL is the secret.
  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy the Portainer stack
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::notice::PORTAINER_WEBHOOK not set yet, skipping"; exit 0; fi
          curl -fsS -X POST "$WEBHOOK"

  # A new extension version (manifest.template.json) gets signed by Mozilla (unlisted, with its source) and published on
  # Lateshow: public/extension/ holds the signed .xpi and updates.json, the manifest's update_url, so Zen/Firefox update
  # by themselves. Commits with GITHUB_TOKEN start no new run, so this job redeploys itself.
  extension:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Is this version published already?
        id: version
        run: |
          v=$(node -p "require('./extension/manifest.template.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if grep -q "\"version\": \"$v\"" public/extension/updates.json 2>/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: pnpm install --frozen-lockfile
      - name: Sign at Mozilla and publish on Lateshow
        if: steps.version.outputs.new == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then echo "::notice::AMO keys not set, skipping"; exit 0; fi
          pnpm ext:zip
          npx -y web-ext@8.10.0 sign --channel=unlisted --source-dir extension/dist --artifacts-dir signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --upload-source-code extension/lateshow-extension-source.zip --approval-timeout 1800000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Published files are written fresh on the newest main, never merged: another run may have published while
          # Mozilla signed. An older version than the one already out is signed but not published.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B publish origin/main
            current=$(node -p "try{require('./public/extension/updates.json').addons['extension@lateshow.pyvno.xyz'].updates.at(-1).version}catch{''}")
            newer=$(node -e "const a=process.argv[1].split('.').map(Number),b=(process.argv[2]||'0').split('.').map(Number);for(let i=0;i<3;i++){if(a[i]!==b[i]){console.log(a[i]>b[i]);process.exit()}}console.log(false)" "$VERSION" "$current")
            if [ "$newer" != "true" ]; then echo "::notice::$current is already out, $VERSION stays signed but unpublished"; exit 0; fi
            mkdir -p public/extension
            rm -f public/extension/*.xpi
            cp signed/*.xpi "public/extension/lateshow-$VERSION.xpi"
            node -e '
              const v = process.env.VERSION;
              const link = `https://lateshow.pyvno.xyz/extension/lateshow-${v}.xpi`;
              const doc = { addons: { "extension@lateshow.pyvno.xyz": { updates: [{ version: v, update_link: link }] } } };
              require("fs").writeFileSync("public/extension/updates.json", JSON.stringify(doc, null, 2) + "\n");
            '
            git add public/extension
            git commit -q -m "Extension $VERSION, signed by Mozilla"
            if git push -q origin publish:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          if [ -n "$WEBHOOK" ]; then curl -fsS -X POST "$WEBHOOK"; fi

  # Chrome Web Store: a version not yet out (same check as Mozilla's) is uploaded and sent to review, Google
  # publishes it once it passes (Unlisted, as set in the dashboard). Its own job, so a Chrome hiccup never holds up
  # Firefox. A version Chrome already has (a re-run after Mozilla failed) is skipped.
  chrome:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CWS_PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_ITEM: olpjkleefegccejonlngdnnphnapcbfj
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Does Chrome have this version already?
        id: version
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CWS_REFRESH_TOKEN" ] || [ -z "$CWS_PUBLISHER" ]; then echo "::notice::Chrome Web Store not set up, skipping"; echo "new=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          v=$(node -p "require('./extension/manifest.template.json').version")
          token=$(curl -fsS https://oauth2.googleapis.com/token -d client_id="$CWS_CLIENT_ID" \
            -d client_secret="$CWS_CLIENT_SECRET" -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token')
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          status=$(curl -fsS "https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER/items/$CWS_ITEM:fetchStatus" \
            -H "Authorization: Bearer $token")
          echo "status: $status"
          # published or in review (submitted) with this version: nothing to do. Not Firefox's updates.json, AMO can lag
          if echo "$status" | node -e 'const v=process.argv[1];const s=require("fs").readFileSync(0,"utf8");process.exit(s.match(/"crxVersion":\s*"([^"]+)"/g)?.some(m=>m.endsWith(`"${v}"`))?0:1)' "$v"; then
            echo "::notice::Chrome has $v already (published or in review)"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: pnpm install --frozen-lockfile
      - name: Upload to the Chrome Web Store and submit for review
        if: steps.version.outputs.new == 'true'
        env:
          token: ${{ steps.version.outputs.token }}
        run: |
          pnpm ext:chrome
          api="https://chromewebstore.googleapis.com"
          item="publishers/$CWS_PUBLISHER/items/$CWS_ITEM"
          up=$(curl -sS -X POST "$api/upload/v2/$item:upload" -H "Authorization: Bearer $token" \
            -H "Content-Type: application/zip" --data-binary @extension/lateshow-chrome.zip)
          echo "upload: $up"
          state=$(node -pe 'JSON.parse(process.argv[1]).uploadState ?? ""' "$up")
          # Chrome has this version already (a re-run): nothing to do
          if echo "$up" | grep -qi "version"; then
            if [ "$state" != "SUCCEEDED" ] && [ "$state" != "IN_PROGRESS" ]; then echo "::notice::Chrome has this version already"; exit 0; fi
          fi
          for i in $(seq 1 20); do
            [ "$state" = "SUCCEEDED" ] && break
            [ "$state" = "IN_PROGRESS" ] || { echo "::error::Upload failed: $up"; exit 1; }
            sleep 15
            up=$(curl -sS "$api/v2/$item:fetchStatus" -H "Authorization: Bearer $token")
            state=$(node -pe 'const j = JSON.parse(process.argv[1]); j.lastAsyncUploadState ?? j.uploadState ?? ""' "$up")
          done
          [ "$state" = "SUCCEEDED" ] || { echo "::error::Upload still not done: $up"; exit 1; }
          curl -fsS -X POST "$api/v2/$item:publish" -H "Authorization: Bearer $token"
          echo
