# Lateshow as it runs in Dokploy (Compose > Raw). Keep this file and the Dokploy copy identical.
# The image comes from CI (.github/workflows/ci.yml, job deploy) after the checks pass; secrets come from Dokploy's
# Environment tab, which Dokploy writes to .env next to this file. No ports: the proxy reaches lateshow:3000 over `websites`.
services:
  lateshow:
    image: ghcr.io/pyvnoaim/lateshow:latest
    pull_policy: always # each deploy fetches the newest build
    container_name: lateshow
    env_file: .env
    mem_limit: 1g
    volumes:
      - data:/data # the SQLite database, backed up nightly
      - cache:/app/.next/cache # resized images
    networks: [websites]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  websites:
    external: true

volumes:
  data:
    name: lateshow_data # fixed names, so they stay the same volumes whatever the compose project is called
  cache:
    name: lateshow_cache
