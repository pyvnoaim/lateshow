# Portainer stack (Stacks > Add stack > Repository, see README). Portainer clones the repo and builds it here.
# No published port: Nginx Proxy Manager reaches it as http://lateshow:3000 over the shared `websites` network.
services:
  lateshow:
    build: .
    # Without this a redeploy reuses the image already on the host and ships the old code.
    pull_policy: build
    container_name: lateshow
    # Portainer writes the stack's environment variables to stack.env.
    env_file:
      - path: stack.env
        required: false
    volumes:
      - data:/data
      - cache:/app/.next/cache
    networks:
      - websites
    init: true
    restart: unless-stopped
    # Next finishes requests in flight on SIGTERM. Rooms keep connections open, so give it time.
    stop_grace_period: 30s

volumes:
  data:
  cache:

networks:
  websites:
    external: true
