<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: radial-gradient(120% 90% at 75% 110%, #1b2433 0%, #07080a 55%, #000 100%);
        font-family: "Inter Tight", sans-serif;
        color: #f5f5f7;
      }
      .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        padding: 0 110px;
        box-sizing: border-box;
      }
      .text {
        max-width: 520px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #b4c8ea;
      }
      .brand img {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }
      h1 {
        font-size: 60px;
        line-height: 1.02;
        letter-spacing: -0.045em;
        margin: 28px 0 22px;
        text-wrap: balance;
      }
      p {
        font-size: 21px;
        line-height: 1.5;
        color: #8e8e93;
        margin: 0;
        text-wrap: pretty;
      }
      .frame {
        width: 376px;
        height: 700px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow:
          0 40px 120px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(255, 255, 255, 0.08);
        transform: scale(1.05);
      }
      iframe {
        border: 0;
        width: 376px;
        height: 700px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="text">
        <div class="brand"><img src="popup/icon-128.png" alt="" />Lateshow</div>
        <h1>What you finish, marked by itself.</h1>
        <p>Netflix, Prime Video and Crunchyroll. Your history and watchlists come along with one Sync.</p>
      </div>
      <div class="frame"><iframe src="popup/popup.html"></iframe></div>
    </div>
  </body>
</html>
