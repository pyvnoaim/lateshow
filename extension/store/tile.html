<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: radial-gradient(120% 100% at 50% 120%, #1f2a3b 0%, #07080a 60%, #000 100%);
        font-family: "Inter Tight", sans-serif;
        color: #f5f5f7;
      }
      .c {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 0;
        font-size: 38px;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        font-size: 16px;
        color: #8e8e93;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <img src="popup/icon-128.png" alt="" />
      <h1>Lateshow</h1>
      <p>What you finish, marked by itself.</p>
    </div>
  </body>
</html>
