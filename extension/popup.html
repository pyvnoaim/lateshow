<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lateshow</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0c;
        --fg: #f5f5f7;
        --muted: #8e8e93;
        --accent: #b4c8ea;
        --soft: rgba(255, 255, 255, 0.045);
        --line: rgba(255, 255, 255, 0.08);
      }
      body {
        margin: 0;
        width: 340px;
        padding: 18px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.4 "Inter Tight",
          -apple-system,
          system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      header img {
        width: 28px;
        height: 28px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      #who {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #c7c7cc;
      }
      #who:not(:empty) {
        height: 26px;
        padding: 0 10px 0 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
      }
      .avatar {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      p {
        margin: 0;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .label {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .note {
        font-size: 12px;
        color: var(--muted);
        text-wrap: pretty;
      }
      .center {
        text-align: center;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
      }
      .text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .badge {
        flex-shrink: 0;
        border-radius: 7px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }
      .primary {
        height: 44px;
        border: 0;
        border-radius: 999px;
        font-weight: 600;
        font-size: 15px;
        color: var(--bg);
        background: linear-gradient(180deg, #f2f6fd, #a9c2ea);
      }
      .pill {
        align-self: flex-start;
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        font-weight: 600;
        font-size: 13px;
        color: var(--bg);
        background: linear-gradient(180deg, #f2f6fd, #a9c2ea);
      }
      .primary:active,
      .pill:active,
      .sync-btn:active,
      .tile:active {
        transform: scale(0.97);
      }
      .link {
        border: 0;
        background: none;
        padding: 0;
        color: var(--muted);
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .link:hover {
        color: var(--fg);
      }
      /* A: not connected */
      .hero {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 18px;
      }
      .hero h2 {
        margin: 0;
        font-size: 26px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }
      .hero p {
        color: var(--muted);
        text-wrap: pretty;
      }
      .first {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 8px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 14px 6px;
        border: 0;
        border-radius: 14px;
        background: var(--soft);
        font-size: 12px;
      }
      .tile:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      /* D: a sync */
      .sync {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(180, 200, 234, 0.08);
        box-shadow: inset 0 0 0 1px rgba(180, 200, 234, 0.16);
      }
      .sync-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .ok {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: rgba(180, 200, 234, 0.18);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .x {
        margin-left: auto;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        font-size: 16px;
        line-height: 1;
      }
      .bar {
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .fill {
        width: 0;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #a9c2ea, #f2f6fd);
        transition: width 0.6s ease;
      }
      /* reading: how much there is isn't known yet, a light runs along */
      .bar.running .fill {
        width: 35%;
        animation: run 1.4s ease-in-out infinite;
      }
      @keyframes run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar.running .fill {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }
      }
      .big {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .look {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: rgba(180, 200, 234, 0.1);
        color: #eef1f6;
        font-size: 13px;
        text-align: left;
      }
      .look span {
        flex: 1;
      }
      /* C: marked this week */
      .recent {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .recent-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      /* C: the sites */
      .sites {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
      }
      .site {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
      }
      .sync-btn {
        flex-shrink: 0;
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        color: #e6e6ea;
        font-size: 12px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .sync-btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.12);
      }
      .switch {
        flex-shrink: 0;
        width: 38px;
        height: 22px;
        border: 0;
        border-radius: 999px;
        padding: 3px;
        display: flex;
        background: rgba(255, 255, 255, 0.14);
      }
      .switch.on {
        justify-content: flex-end;
        background: var(--accent);
      }
      .knob {
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--muted);
      }
      .switch.on .knob {
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icon-128.png" alt="" />
      <h1>Lateshow</h1>
      <span id="who"></span>
    </header>
    <main id="app" aria-live="polite"></main>
    <script src="popup.js"></script>
  </body>
</html>
