<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lateshow</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050506;
        --fg: #eef1f6;
        --muted: #8b8f98;
        --accent: #b4c8ea;
      }
      body {
        margin: 0;
        width: 300px;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.45 "Inter Tight",
          system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        text-wrap: pretty;
      }
      .count {
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
      button.primary {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #f2f6fd, #a9c2ea);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button.text {
        border: 0;
        background: none;
        color: var(--muted);
        padding: 4px 0 14px;
      }
      button.text:hover {
        color: var(--fg);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0 12px;
      }
      .site {
        display: block;
        font-weight: 600;
      }
      .hint {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }
      .foot {
        margin-top: 8px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .switch {
        flex-shrink: 0;
        width: 44px;
        height: 26px;
        border: 0;
        border-radius: 999px;
        padding: 3px;
        display: flex;
        background: rgba(255, 255, 255, 0.12);
      }
      .switch.on {
        justify-content: flex-end;
        background: linear-gradient(180deg, #f2f6fd, #a9c2ea);
      }
      .knob {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: #8b8f98;
      }
      .switch.on .knob {
        background: var(--bg);
      }
      button.primary:active {
        transform: scale(0.98);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Lateshow</h1>
    <main id="app" aria-live="polite"></main>
    <script src="popup.js"></script>
  </body>
</html>
